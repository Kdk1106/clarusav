[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarusav"
version = "0.1.0"
description = "Lightweight, explainable, container-deployed CLI antivirus for Windows PE files"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClarusAV Team" }
]
dependencies = [
    "pefile==2024.8.26",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "shap==0.53.0",
    "typer==0.27.3",
    "rich==15.0.0",
    "psutil==7.2.2",
    "watchdog==6.0.0",
    "docker==7.1.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
clarusav = "clarusav.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["clarusav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard Typer idiom)
]
